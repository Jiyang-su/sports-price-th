<header class="hero places-hero" style="background-image:url(img/places/bkk-benjakitti.jpg);min-height:46svh"><div class="kick up" style="color:#c13a5a">ที่วิ่งดี</div><h1>สถานที่วิ่งชิลๆ ทีละจังหวัด</h1><p>ที่วิ่งดี — สถานที่วิ่งชิลๆ ทีละจังหวัด · กรุงเทพฯ · เชียงใหม่ แล้วค่อยๆ เพิ่ม</p></header>
<section class="sec" style="--acc:#2d6a4f;padding-bottom:8px">
<div class="pfilters" id="pfilters" role="tablist" aria-label="เลือกจังหวัด"></div>
<div id="plist" class="pgrid"></div>
<p class="meta" style="margin-top:22px">พิกัดเปิดใน Google Maps · ภาพจาก Wikimedia Commons (สัญญาอนุญาตเสรี) ดู <a href="img/CREDITS.md">เครดิตภาพ</a> · เวลาเปิด–ปิดและค่าเข้าอาจเปลี่ยน โปรดเช็กก่อนไป</p>
</section>
<script>
const gmap=(lat,lng)=>`https://www.google.com/maps?q=${lat},${lng}`;
const osm=(lat,lng)=>`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}`;
const provs=[...new Set(PLACES.map(p=>p.province))];
let cur=provs[0]||'';
function paint(){
  $('pfilters').innerHTML=provs.map(p=>`<button type="button" class="pchip${p===cur?' on':''}" data-p="${esc(p)}" aria-pressed="${p===cur}">${esc(p)}</button>`).join('');
  const rows=PLACES.filter(p=>p.province===cur);
  $('plist').innerHTML=rows.map(p=>`<article class="pcard" id="${esc(p.id)}">
    <div class="pimg" style="background-image:url(${esc(p.image)})" role="img" aria-label="${esc(p.name)}"></div>
    <div class="pbody">
      <div class="kick up" style="color:var(--acc);margin:0">${esc(p.area)}</div>
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.blurb)}</p>
      ${p.tips?`<div class="meta">${esc(p.tips)}</div>`:''}
      <div class="pmap">📍 ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)} ·
        <a href="${gmap(p.lat,p.lng)}" target="_blank" rel="nofollow noopener" data-out="gmaps" data-pos="places">Google Maps</a> ·
        <a href="${osm(p.lat,p.lng)}" target="_blank" rel="nofollow noopener" data-out="osm" data-pos="places">OpenStreetMap</a>
      </div>
    </div>
  </article>`).join('')||'<p class="note">ยังไม่มีที่วิ่งในจังหวัดนี้ — กำลังทยอยเพิ่ม</p>';
}
$('pfilters').addEventListener('click',e=>{const b=e.target.closest('.pchip');if(!b)return;cur=b.dataset.p;paint()});
paint();
</script>
