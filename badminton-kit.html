<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ชุดเริ่มต้นแบดมินตัน</title>
<meta name="description" content="จัดชุดแบดมินตันมือใหม่ ไม้ รองเท้า ลูก กริป ในงบที่ตั้งไว้"><meta property="og:title" content="ชุดเริ่มต้นแบดมินตัน"><meta property="og:type" content="website"><meta property="og:locale" content="th_TH"><meta name="theme-color" content="#0b5cad">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><script src="common.js"></script></head><body><header class="hero" style="background-image:url(img/badminton2.jpg);min-height:56svh;--acc:#2ecc71"><div class="kick up" style="color:#2ecc71">ตัวช่วยเลือก · แบดมินตัน</div><h1>ชุดเริ่มต้นแบดมินตัน<br>ในงบที่คุณตั้ง</h1></header>
<section class="sec" style="--acc:#2ecc71"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
<div><label class="up kick">ระดับ</label><select id="lvl"><option value="new">เพิ่งเริ่มเล่น</option><option value="casual">เล่นเป็นประจำ (สนุกๆ)</option></select></div>
<div><label class="up kick">เล่นบ่อยแค่ไหน</label><select id="freq"><option value="1">เดือนละ 1–3 ครั้ง</option><option value="2">สัปดาห์ละ 1–2 ครั้ง</option><option value="3">สัปดาห์ละ 3 ครั้งขึ้นไป</option></select></div>
<div><label class="up kick">งบรวมทั้งชุด</label><select id="bud"><option>1500</option><option selected>3000</option><option>5000</option></select></div></div>
<p><button class="btn acc" id="go">จัดชุดให้ฉัน</button></p><div id="out"></div></section>
<script>
let K=[];fetch('badminton.json').then(r=>r.json()).then(j=>{K=j;run()});
const LBL={racket:'ไม้แบด',shoe:'รองเท้าแบด',shuttle:'ลูกขนไก่',grip:'กริปพันด้าม',bag:'กระเป๋า'};
function pick(part,max,pref){let c=K.filter(x=>x.part==part&&x.e<=max);if(pref)c=c.filter(pref).length?c.filter(pref):c;c.sort((a,b)=>b.e-a.e);return c[0]||null}
function run(){const B=+$('bud').value,f=+$('freq').value,lvl=$('lvl').value;
 // budget split (shoes matter for injury prevention; racket next)
 const share=B<=1500?{racket:.35,shoe:0,shuttle:.15,grip:.05}:{racket:.35,shoe:.45,shuttle:.12,grip:.03,bag:.05};
 const items=[],why={};let left=B;
 const sh=pick('shuttle',B*share.shuttle,x=>f>=2?x.feather||!x.plastic:x.plastic);
 const rk=pick('racket',B*share.racket+(share.shoe?0:B*.3),x=>x.strung);
 const so=share.shoe?pick('shoe',B*share.shoe):null;
 const gr=pick('grip',B*share.grip+60);
 let bg=share.bag?pick('bag',B-[rk,so,sh,gr].reduce((s,x)=>s+(x?x.e:0),0)):null;
 [['racket',rk],['shoe',so],['shuttle',sh],['grip',gr],['bag',bg]].forEach(([k,x])=>{if(x)items.push([k,x])});
 const tot=items.reduce((s,[,x])=>s+x.e,0);
 const reason={racket:x=>(x.strung?'ชื่อสินค้าระบุว่าขึงเอ็นมาแล้ว ใช้ได้ทันทีไม่ต้องจ่ายค่าขึงเพิ่ม · ':'')+(lvl=='new'?'มือใหม่ยังไม่จำเป็นต้องใช้ไม้ราคาสูง เลือกไม้ในงบที่เหลือพอให้ซื้อรองเท้าได้':'ใช้งบส่วนใหญ่กับไม้เพื่อให้ได้ไม้ที่ทนกว่า'),
  shoe:x=>'รองเท้าแบดพื้นยางสำหรับคอร์ท ช่วยยึดเกาะและลดโอกาสข้อเท้าพลิกมากกว่ารองเท้าวิ่ง จึงให้งบส่วนนี้มาก',
  shuttle:x=>x.plastic?'ลูกพลาสติก (ไนลอน) ทนกว่า เหมาะกับการเล่นไม่บ่อยและฝึกพื้นฐาน':x.feather?'ลูกขนเป็ดวิถีใกล้เคียงการเล่นจริง เหมาะกับคนเล่นบ่อย':'ลูกแบดสำหรับฝึกซ้อม',
  grip:x=>'กริปใหม่ช่วยให้จับไม้กระชับและซับเหงื่อ ราคาไม่แพง',bag:x=>'งบเหลือพอสำหรับกระเป๋าใส่ไม้และรองเท้า (ไม่จำเป็น)'};
 const missing=['racket','shuttle'].concat(share.shoe?['shoe']:[]).filter(k=>!items.find(([kk])=>kk==k));
 $('out').innerHTML=`<p class="meta">รวมทั้งชุด <b style="color:#fff;font-size:22px">${fmt(tot)}</b> จากงบ ${fmt(B)} · ใช้สินค้าจริงจากแคตตาล็อก เลือกตัวที่ราคาใกล้งบแต่ละส่วนที่สุด</p>
 ${B<=1500?'<div class="note">งบ 1,500 บาท ยังไม่พอสำหรับรองเท้าแบดในแคตตาล็อก (ถูกสุดราว '+fmt(Math.min(...K.filter(x=>x.part=='shoe').map(x=>x.e)))+') แนะนำใช้รองเท้าผ้าใบพื้นยางที่มีอยู่ก่อน</div>':''}
 ${missing.length?`<div class="note">ไม่พบ${missing.map(k=>LBL[k]).join(', ')}ในงบนี้จากแคตตาล็อก</div>`:''}
 <div class="grid" style="margin-top:16px">${items.map(([k,x])=>`<div class="card"><div class="kick up" style="color:var(--acc);margin:0 0 8px">${LBL[k]}</div><img class="pi" src="${esc(x.i)}" alt=""><div class="nm">${esc(x.n)}</div><div class="pr">${fmt(x.e)}</div><div class="meta">${esc(x.b)} · ข้อมูล ณ ${thDate(x.d)}</div><p style="font-size:13px;color:#cfd4da">${reason[k](x)}</p><a class="btn sm acc" style="margin-top:auto;text-align:center" href="${esc(x.u)}" target="_blank" rel="noopener sponsored">ไปที่หน้าร้าน</a></div>`).join('')}</div>`}
$('go').onclick=run;
</script>
</body></html>
